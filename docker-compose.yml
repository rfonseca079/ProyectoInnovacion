services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planificador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planificador}
      POSTGRES_DB: ${POSTGRES_DB:-planificador}
    ports:
      - "55432:5432"
    volumes:
      - planificador_pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planificador -d planificador"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://planificador:planificador@postgres:5432/planificador
      PORT: "3000"
      HOST: 0.0.0.0
      NODE_ENV: development
      SESSION_SECRET: demo-session-secret-planificador
      WEB_ORIGIN: http://localhost:8088,http://127.0.0.1:8088
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/auth/me').then((response)=>process.exit(response.status===401?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s

  web:
    build:
      context: ./frontend
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  planificador_pg:
